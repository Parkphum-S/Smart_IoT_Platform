services:
  backend:
    image: smart-iot-backend:local

    build:
      context: ./backend
      dockerfile: Dockerfile

    platform: linux/arm64

    container_name: smart-iot-backend

    # PostgreSQL remains on the Host.
    # Backend binds only to Host loopback.
    network_mode: host

    env_file:
      - ./backend/.env.runtime


    init: true

    restart: unless-stopped

    stop_grace_period: 30s

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 128

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      GATEWAY_ENCRYPTION_KEYRING_FILE: /run/smart-iot-platform/gateway-keyring.json
      GATEWAY_ENCRYPTION_KEY_VERSION: v20261120_0108
      MIGRATION_DATABASE_PASSWORD_FILE: /run/smart-iot-platform/migration-credential
    volumes:
      - /run/smart-iot-platform/gateway-keyring.json:/run/smart-iot-platform/gateway-keyring.json:ro
      - /run/smart-iot-platform/migration-credential:/run/smart-iot-platform/migration-credential:ro

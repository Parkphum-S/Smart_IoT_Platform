services:
  backend:
    image: smart-iot-backend:local

    build:
      context: ./backend
      dockerfile: Dockerfile

    platform: linux/arm64

    container_name: smart-iot-backend

    # PostgreSQL remains on the Host.
    # Backend binds only to Host loopback.
    network_mode: host

    env_file:
      - ./backend/.env.runtime


    init: true

    restart: unless-stopped

    stop_grace_period: 30s

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 128

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
